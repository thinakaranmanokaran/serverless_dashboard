<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ───────────────────────────────────────── -->
    <title>RemoteConfig.io — GitHub-Native Remote Configuration for Developers</title>
    <meta name="description" content="Manage production app configurations in real-time using your GitHub repo as a backend. No servers, no lock-in. Feature flags, JSON config, and instant updates — all in one place." />
    <meta name="keywords" content="remote config, remote configuration, github config management, feature flags, json configuration, serverless config, developer tools, production config, github personal access token, remoteconfig" />
    <meta name="author" content="Thinakaran Manokaran" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0f0f0f" />

    <!-- ── Canonical ─────────────────────────────────────────── -->
    <link rel="canonical" href="https://remoteconfig.io/" />

    <!-- ── Open Graph ────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RemoteConfig.io" />
    <meta property="og:url" content="https://remoteconfig.io/" />
    <meta property="og:title" content="RemoteConfig.io — GitHub-Native Remote Configuration" />
    <meta property="og:description" content="Update your app's configuration instantly without redeploying. Powered by GitHub. Zero infrastructure required." />
    <meta property="og:image" content="https://remoteconfig.io/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RemoteConfig.io dashboard preview" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ──────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@remoteconfig" />
    <meta name="twitter:creator" content="@thinakaran_dev" />
    <meta name="twitter:url" content="https://remoteconfig.io/" />
    <meta name="twitter:title" content="RemoteConfig.io — GitHub-Native Remote Configuration" />
    <meta name="twitter:description" content="Update your app's config in real-time. No servers. No lock-in. Just GitHub." />
    <meta name="twitter:image" content="https://remoteconfig.io/og-preview.png" />
    <meta name="twitter:image:alt" content="RemoteConfig.io dashboard preview" />

    <!-- ── Favicons ──────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ── Preconnect ────────────────────────────────────────── -->
    <link rel="preconnect" href="https://api.github.com" />

    <!-- ── JSON-LD: Organization ─────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "RemoteConfig.io",
      "url": "https://remoteconfig.io",
      "logo": "https://remoteconfig.io/logo.png",
      "description": "GitHub-native remote configuration dashboard for real-time app updates and feature flagging.",
      "sameAs": ["https://github.com/thinakaran-dev"]
    }
    </script>

    <!-- ── JSON-LD: SoftwareApplication ──────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "RemoteConfig.io",
      "operatingSystem": "Web",
      "applicationCategory": "DeveloperApplication",
      "url": "https://remoteconfig.io",
      "description": "A GitHub-native remote configuration dashboard. Manage production JSON configs with zero infrastructure using GitHub repositories as your backend.",
      "featureList": [
        "Real-time configuration sync",
        "GitHub repository backend",
        "Feature flag management",
        "JSON/YAML configuration editor",
        "Visual config builder",
        "Zero server infrastructure"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Thinakaran Manokaran",
        "url": "https://thinakaran.dev/"
      }
    }
    </script>

    <!-- ── JSON-LD: WebSite + SearchAction ───────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RemoteConfig.io",
      "url": "https://remoteconfig.io",
      "potentialAction": {
        "@type": "ReadAction",
        "target": "https://remoteconfig.io/docs"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
